<sly data-sly-use.model="com.adobe.aem.guides.wknd.core.models.MediaGalleryBannerModel"
    data-sly-use.templates="core/wcm/components/commons/v1/templates.html"/>

<div class="media-gallery-banner" data-sly-test="${model.hasSlides}" id="${model.galleryId}">

    <!-- Hero Carousel -->
    <div class="hero-carousel" tabindex="0" aria-label="Media gallery banner">
        <div class="hero-slides-wrapper">
            <sly data-sly-list.slide="${model.slides}">
                <div class="${slideList.first ? 'hero-slide active' : 'hero-slide'}"
                     data-slide-index="${slideList.index}"
                     aria-hidden="${slideList.first ? 'false' : 'true'}">

                    <div class="hero-media">
                        <!-- Video slide: show poster + play button -->
                        <sly data-sly-test="${slide.video}">
                            <img class="video-poster"
                                 src="${slide.thumbnailUrl @ context='uri'}"
                                 alt="${slide.videoPosterAlt @ context='text'}"/>
                            <button class="play-video-btn"
                                    type="button"
                                    aria-label="Play video"
                                    data-video-url="${slide.assetPath @ context='uri'}">
                                <span class="play-icon" aria-hidden="true">&#9654;</span>
                            </button>
                        </sly>

                        <!-- Image slide -->
                        <sly data-sly-test="${!slide.video}">
                            <img src="${slide.assetPath @ context='uri'}"
                                 alt="${slide.altText @ context='text'}"/>
                        </sly>
                    </div>

                    <!-- Overlay Labels / Badges -->
                    <div class="overlay-labels" data-sly-test="${slide.overlayLabels}">
                        <sly data-sly-list.label="${slide.overlayLabels}">
                            <span class="badge">${label @ context='text'}</span>
                        </sly>
                    </div>

                </div>
            </sly>
        </div>

        <!-- Navigation Arrows -->
        <button class="carousel-arrow prev" type="button" aria-label="Previous slide">&#8249;</button>
        <button class="carousel-arrow next" type="button" aria-label="Next slide">&#8250;</button>
    </div>

    <!-- Thumbnail Navigation Strip -->
    <div class="thumbnail-strip" aria-label="Thumbnail navigation">
        <div class="thumbnails-scroll" role="tablist">
            <sly data-sly-list.thumb="${model.slides}">
                <div class="${thumbList.first ? 'thumbnail active' : 'thumbnail'}"
                     data-thumb-index="${thumbList.index}"
                     role="button"
                     tabindex="0"
                     aria-selected="${thumbList.first ? 'true' : 'false'}"
                     aria-label="Go to slide ${thumbList.count}">
                    <img src="${thumb.thumbnailUrl @ context='uri'}"
                         alt="${thumb.altText @ context='text'}"/>
                    <span class="thumb-play-icon" aria-hidden="true"
                          data-sly-test="${thumb.video}">&#9654;</span>
                </div>
            </sly>
        </div>
    </div>

    <!-- Video Lightbox -->
    <div class="lightbox" style="display:none;">
        <div class="lightbox-content">
            <video class="lightbox-video" controls>
                <source src="" type="video/mp4"/>
            </video>
            <button class="close-lightbox" type="button" aria-label="Close video">&times;</button>
        </div>
    </div>
</div>

<sly data-sly-call="${templates.placeholder @ isEmpty=!model.hasSlides}"/>
